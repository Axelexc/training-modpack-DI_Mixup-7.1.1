name: Build Training Modpack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plugin:
    name: Build plugin NRO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install cargo-skyline
        run: |
          cargo install --git https://github.com/jam1garner/cargo-skyline --force
          cargo-skyline skyline update-std
      - name: Build release NRO
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: libtraining_modpack
          path: target/aarch64-skyline-switch/release/libtraining_modpack.nro
